<style>
/* Layout: en-tête collant + onglets (Tournoi, Poules, Tableau final, Classement, Planning), contenu en cartes de match. */
:root{

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-head);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:26px} h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 0}
.brand{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand h1{font-size:clamp(30px,3.1vw,46px);line-height:1.05;display:flex;gap:14px;align-items:center;color:var(--court)}
#prs-bg{position:fixed;inset:0;z-index:10000;background:var(--bg,#fffaf3);overflow:auto;padding:18px 24px;box-sizing:border-box}
.prs-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.prs-title{font-size:clamp(22px,3vw,44px);font-weight:800;color:var(--court)}
.prs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,780px),1fr));gap:18px}
.prs-card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px}
.prs-card h2{margin:0 0 10px;font-size:clamp(26px,3vw,46px);color:var(--court)}
.prs-pair{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}

.prs-names{flex:1;min-width:0;overflow:hidden;line-height:1.25}
.prs-fit{display:inline-block;white-space:nowrap}

.prs-fit i{font-style:normal;margin:0 .3em;color:var(--ink2)}
.prs-seed{flex:none;font-size:clamp(16px,1.8vw,28px);font-weight:800;color:var(--court)}
.tabrow #prslot{flex:none;display:none;align-items:flex-end}
.tabrow.hasqr #prslot{display:flex}.tabrow #prslot button{height:44px;margin-bottom:6px;white-space:nowrap;border-radius:10px;font-size:13px;padding:0 12px}

.tabrow.hasqr{align-items:flex-end}.tabrow.hasqr #homebtn{height:44px!important;margin-bottom:6px}.tabrow.hasqr nav.tabs{align-self:flex-end}.tabrow #qrslot{flex:none;display:flex;align-items:center;margin-bottom:2px;margin-top:4px}.tabrow #qrslot .qrmini{padding:2px;border-radius:6px}
@media(max-width:700px){.tabrow #qrslot{display:none}}
.qrmini{flex:0 0 auto!important;width:max-content!important;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff;font-size:10px;font-weight:700;color:var(--ink2)}
.logo{cursor:pointer;background:#fff;border-radius:8px;padding:4px 8px;display:inline-flex;border:1px solid var(--line)}.logo img{height:54px;width:auto;display:block}
h1#x{}
.sub{color:var(--ink2);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:6px}

.tabrow{display:flex;align-items:center;gap:10px;margin-top:10px;box-shadow:inset 0 -2px 0 var(--line)}
a.btn{text-decoration:none;display:inline-block;flex:none;color:var(--ink)}a.btn.primary{color:#fff}
.tabrow{align-items:stretch}
.tabrow .tools{flex:none;display:flex}
.tabrow #homebtn{height:100%;border-radius:10px;display:flex;align-items:center;padding:0 12px!important;font-size:13px!important;order:0!important;margin-top:-4px;margin-bottom:9px;height:calc(100% - 5px)}
@media(max-width:700px){.tabrow{flex-wrap:wrap}.tabrow .tools{order:-1;width:100%;justify-content:flex-end}.tabrow nav.tabs{flex:1 1 100%;width:100%}}

main{padding-top:20px;display:grid;gap:20px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}

td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:middle}

tr.pairsep td{border-top:2px solid var(--ink2)}
.seed{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:11px;background:var(--court-soft);color:var(--court);font:700 13px var(--f-head)}
.pos{font:700 20px var(--f-head);color:var(--ink2)}
.pairline{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);min-width:0}
.pairline:first-of-type{border-top:0}
.pairline .nm{flex:1;min-width:0}
.pairline .pw{flex:none;font-weight:700;font-size:.82em;color:var(--ink2);font-variant-numeric:tabular-nums}
.nm b{display:block;overflow-wrap:anywhere}
.nm small{color:var(--ink2)}
.pairline.sel{background:var(--ball);color:var(--ball-ink);border-radius:5px;padding-inline:6px}
.match{border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden;min-width:0}

.match .mh{flex-wrap:wrap}
.mh label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

.match.live{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}

.unit{flex:1;display:flex;align-items:center;position:relative;padding:5px 0}

.unit.sl::before,.unit.sr::after{content:"";position:absolute;top:50%;width:14px;border-top:2px solid var(--ink2)}

.pill{font-size:11px}

.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:16px;position:relative;min-width:200px}

.bcol.qf.l::after{right:-14px;border-left:0}
.bcol.qf.r::before{left:-14px;border-right:0}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:var(--court-soft);color:var(--court)}
.pill.ok{background:var(--win);color:var(--good)}
.stand td,.stand th{padding:3px 6px}
.tlive{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.04em;color:#fff;background:#d32f2f;border-radius:999px;padding:2px 10px}.tlive i{width:8px;height:8px;border-radius:50%;background:#fff;animation:livep 1.2s infinite}@keyframes livep{50%{opacity:.25}}

.pchips{display:none}
@media(max-width:700px){.pchips{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px}.pchips .btn{flex:1 0 auto;white-space:nowrap;padding:9px 12px;font-weight:700}.pgrid .pc:not(.pcsel),.prg .pcard:not(.pcsel){display:none}}

.prv{display:grid;gap:20px}.wide .prv{gap:12px}.prv section.card{max-width:700px}.prv section.card:first-of-type+section.card table{table-layout:auto}.prv th.num,.prv td.num{text-align:center!important}.prv td,.prv th{padding-left:6px;padding-right:6px}

  if(r===0){for(t=k+1;t<=maxS;t++)for(gi3=1;gi3<=G;gi3++)if(g[gi3-1].length>=t)ents.push({ref:'T'+t+':'+gi3,g:gi3,t:t})}
  var pow2=M2>=2&&!(M2&(M2-1));
  var wantPlay=M.classMode==='play'||(M.classMode==='auto'&&M2>=2&&M2<=4);
  R.classPlay=!!(wantPlay&&r===0&&pow2&&ents.length===M2);
  if(M.classMode==='play'&&!R.classPlay&&M2>=2)R.notes.push('Les matchs de classement des non-qualifiés ne sont possibles que si leur nombre est une puissance de 2 et sans meilleurs '+tierName(k+1)+' : classement des poules utilisé à la place.');
  if(R.classPlay){
    var presetC=(G===4&&M2===4&&ents.every(function(e){return e.t===ents[0].t}))?[4,2,1,3]:null;
    var co=bracketOrder(ents,presetC);
    var cs={name:'Places '+(Q+Sn+1)+' à '+N,start:Q+Sn+1,matches:[]};sections.push(cs);
    playoff(co.map(function(ix){return ents[ix].ref}),Q+Sn+1,cs,false,0);
    sections.sort(function(a,b){return a.start-b.start});
  }
  /* classement par poules (non joué) : victoires, défaites, différence de jeux ;
     égalité parfaite dans la même poule = confrontation directe, entre poules = places ex aequo (la plus haute) */
  var rankPlaces=[],dispPlace={};
  if(!R.classPlay&&R.allDone){
    var cands=[];
    R.pool.forEach(function(P,pgi){P.rows.forEach(function(row,ri){
      var q=ri<k||(ri===k&&r>0&&bestList.some(function(x){return x.id===row.id}));
      if(!q)cands.push({row:row,g:pgi,ri:ri,w:row.w,l:row.l,d:row.pf-row.pa})})});
    cands.sort(function(x,y){return y.w-x.w||x.l-y.l||y.d-x.d||x.ri-y.ri||by[x.row.id].seed-by[y.row.id].seed});
    /* cohérence avec le classement interne des poules */
    var i6=0;
    while(i6<cands.length){
      var j6=i6;while(j6<cands.length&&cands[j6].w===cands[i6].w&&cands[j6].l===cands[i6].l)j6++;
      var grp2=cands.slice(i6,j6),res2=grp2.slice(),pg={};
      grp2.forEach(function(c,ix){(pg[c.g]=pg[c.g]||[]).push(ix)});
      Object.keys(pg).forEach(function(g6){
        var slots=pg[g6],mem=slots.map(function(ix){return grp2[ix]}).sort(function(x,y){return x.ri-y.ri});
        slots.forEach(function(ix,n6){res2[ix]=mem[n6]})});
      for(var z=0;z<res2.length;z++)cands[i6+z]=res2[z];
      i6=j6;
    }
    cands.forEach(function(c,ix){
      var place=Q+Sn+1+ix,prev=ix>0?cands[ix-1]:null;
      if(prev&&prev.w===c.w&&prev.l===c.l&&prev.d===c.d&&prev.g!==c.g)place=dispPlace[Q+Sn+ix]||Q+Sn+ix;
      dispPlace[Q+Sn+1+ix]=place;rankPlaces.push(c.row.id)});
  }
  /* places finales */
  var places={};
  Object.keys(placeRefs).forEach(function(pl){places[pl]=slotPair(placeRefs[pl])});
  rankPlaces.forEach(function(id,ix){places[Q+Sn+1+ix]=id});
  R.places=places;R.dispPlace=dispPlace;

  /* planning */
  var courts=Math.max(1,toInt(M.courts,1)), dur=Math.max(5,toInt(M.dur,45))+Math.max(0,toInt(M.pause,0)), t0=parseTime(M.start);
  var used=[],slotOf={},last={},gEnd=[],gLeft=[];
  for(i=0;i<G;i++){gEnd.push(0);gLeft.push(R.pool[i]?R.pool[i].ms.length:0)}
  function put(min){var s=min;while((used[s]||0)>=courts)s++;used[s]=(used[s]||0)+1;return s}
  var maxRound=0,poolLeft=0;R.pool.forEach(function(P){maxRound=Math.max(maxRound,P.ms.length);poolLeft+=P.ms.length});
  var depth={};
  function depDepth(ref){var m;if((m=/^[WL]:(\w+)$/.exec(ref)))return depth[m[1]]||1;return 0}
  var ko=list.filter(function(m){return m.kind==='ko'});
  ko.forEach(function(m){depth[m.id]=1+Math.max(depDepth(m.ia),depDepth(m.ib))});
  var defOrder=[];
  if(R.pool.length===4&&R.pool.every(function(P){return P.ms.length===6})){
    /* ordre par défaut des poules de 4 paires (4 poules) */
    ['1.1','2.1','3.1','4.1','4.2','1.2','2.2','3.2','4.3','4.4','1.3','2.3','2.4','3.3','3.4','1.4','2.5','3.5','4.5','1.5','1.6','2.6','3.6','4.6'].forEach(function(k){
      var pm=R.pool[+k.split('.')[0]-1].ms[+k.split('.')[1]-1];if(pm)defOrder.push(pm.id)});
  }
  for(var rr=0;rr<maxRound;rr++)for(var gp=0;gp<R.pool.length;gp++){var pm=R.pool[gp].ms[rr];if(pm&&defOrder.indexOf(pm.id)<0)defOrder.push(pm.id)}
  ko.map(function(m,ix){return {m:m,ix:ix}}).sort(function(x,y){return depth[x.m.id]-depth[y.m.id]||x.ix-y.ix}).forEach(function(o){defOrder.push(o.m.id)});
  var ord=[],seen={};
  (S.order||ORDTPL||[]).forEach(function(id){if(MM[id]&&!seen[id]){seen[id]=1;ord.push(id)}});
  defOrder.forEach(function(id){if(!seen[id]){seen[id]=1;ord.push(id)}});
  function depSlot(ref){var m;
    if((m=/^T\d+:(\d+)$/.exec(ref)))return gEnd[+m[1]-1];
    if(/^B\d+$/.test(ref))return gEnd.length?Math.max.apply(null,gEnd):0;
    if((m=/^[WL]:(\w+)$/.exec(ref)))return slotOf[m[1]]==null?0:slotOf[m[1]];
    return 0}
  function ready(m){
    if(m.kind==='pool')return true;
    return [m.ia,m.ib].every(function(ref){var x;
      if((x=/^T\d+:(\d+)$/.exec(ref)))return gLeft[+x[1]-1]===0;
      if(/^B\d+$/.test(ref))return poolLeft===0;
      if((x=/^[WL]:(\w+)$/.exec(ref)))return slotOf[x[1]]!=null;
      return true})}
  var queue=ord.slice(),prevSlot=0;
  while(queue.length){
    var qi=-1;for(var z=0;z<queue.length;z++){if(ready(MM[queue[z]])){qi=z;break}}
    if(qi<0)qi=0;
    var qm=MM[queue.splice(qi,1)[0]],sl;
    if(qm.kind==='pool'){
      sl=put(Math.max(prevSlot,last[qm.a]==null?0:last[qm.a]+1,last[qm.b]==null?0:last[qm.b]+1));
      last[qm.a]=last[qm.b]=sl;gEnd[qm.g]=Math.max(gEnd[qm.g],sl);gLeft[qm.g]--;poolLeft--;
    }else sl=put(Math.max(prevSlot,depSlot(qm.ia)+1,depSlot(qm.ib)+1));
    slotOf[qm.id]=sl;prevSlot=sl;
  }
  var bySlot={};
  list.forEach(function(m){m.slot=slotOf[m.id]});
  var ordered=ord.map(function(id){return MM[id]}).sort(function(x,y){return x.slot-y.slot});
  ordered.forEach(function(m){bySlot[m.slot]=(bySlot[m.slot]||0)+1;m.court=bySlot[m.slot];
    m.time=(S.times&&S.times[m.id])||DEFTIMES[m.id]||fmtTime(t0+m.slot*dur)});
  R.order=ordered.map(function(m){return m.id});
  R.names=function(id){var p=by[id];return p?(p.p.a.nom||'—')+' / '+(p.p.b.nom||'—'):''};
  R.gOf=gOf;
  return R;
}

/* ---------- points ---------- */
function currentTable(){return pointsTable(S.meta.level,S.meta.gender,R&&R.N?R.N:toInt(S.meta.teams,12))}
function pointsFor(place){
  if(S.customPoints&&S.customPoints[place-1]!=null)return num(S.customPoints[place-1]);
  var t=currentTable(),a=t.arr;
  if(place<=a.length)return a[place-1];
  return t.flat?a[a.length-1]:0;
}

/* signature de structure : chaque configuration garde ses scores */
function syncSig(){
  if(!R.ok)return;
  var sig=JSON.stringify([R.groups,R.Q,R.classPlay,R.pool.map(function(P){return P.ids.length})]);
  if(S.sig===sig)return;
  if(!S.sig){S.sig=sig;return}
  if(S.sig){S.sets[S.sig]={scores:S.scores,times:S.times,starts:S.starts,ends:S.ends,terrains:S.terrains}}
  var nx=S.sets[sig];
  S.scores=nx?nx.scores:{};S.times=nx?nx.times:{};S.starts=nx?nx.starts:{};S.ends=nx?nx.ends:{};S.terrains=nx&&nx.terrains?nx.terrains:{};
  if(S.sig&&nx===undefined&&Object.keys(S.sets[S.sig].scores).length)flash='La composition des poules a changé : les scores précédents sont gardés de côté et reviendront si tu retrouves la même composition.';
  S.sig=sig;
  R=compute();
}

/* ---------- rendu ---------- */
var R=null;
function pairLabel(id){return R.names(id)}
function seedTag(id){var s=R.by[id].seed;return s<=R.nSeeds?'TS'+s:'#'+s}
function hm(ms){var d=new Date(ms);return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
function durText(id){
  var st=S.starts[id]; if(!st) return '';
  var mins=Math.max(0,Math.floor(((S.ends[id]||Date.now())-st)/60000));
  return mins>=60?Math.floor(mins/60)+'h'+(mins%60<10?'0':'')+(mins%60):mins+' min';
}
function statusBits(m){
  var st=S.starts[m.id]; if(!st) return '';
  return '<span title="'+(S.ends[m.id]?'Durée du match':'Match en cours')+'">▶ '+hm(st)+' · <span class="dur" data-dur="'+esc(m.id)+'">'+durText(m.id)+'</span></span>';
}
function tod(ms){var d=new Date(ms);return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function anyStartGlobal(){return Object.keys(S.starts).length>0}
function poolEst(P){
  var m=P.ms[P.ms.length-1];if(!m)return {e:0,d:0};
  var dur=Math.max(5,toInt(S.meta.dur,45)),sl=dur+Math.max(0,toInt(S.meta.pause,0)),t0=parseTime(S.meta.start);
  var pe=t0+m.slot*sl+dur,e;
  if(S.ends[m.id])e=tod(S.ends[m.id]);
  else if(S.starts[m.id])e=tod(S.starts[m.id])+dur;
  else{var sh=0;P.ms.forEach(function(x){if(S.starts[x.id])sh=Math.max(sh,tod(S.starts[x.id])-(t0+x.slot*sl))});e=parseTime(m.time)+dur+sh}
  return {e:e,d:Math.round(e-pe)};
}
function terSelect(id){
  var n=Math.max(5,toInt(S.meta.courts,5)),o='<option value="">Terrain</option>',i,cur=S.terrains[id]||'';
  for(i=1;i<=n;i++)o+='<option value="T'+i+'"'+(cur==='T'+i?' selected':'')+'>T'+i+'</option>';
  return '<select class="ter" data-ter="'+esc(id)+'" data-fk="ter-'+esc(id)+'" aria-label="Terrain">'+o+'</select>';
}
function matchCard(m,short){
  function side(id,label,sc,key,ref){
    var win=m.res&&m.res.w===id&&id;
    var veil=veilRef(m,ref);
    var pop=!!(drawAnim&&drawAnim.last===ref&&ref);
    if(veil)return '<div class="mt veil" data-ref="'+esc(ref)+'"><span class="nm">&nbsp;</span></div>';
    var nm=id?'<span class="seed" title="Rang / tête de série">'+seedTag(id)+'</span><span class="nm">'+esc(pairLabel(id))+'</span>':'<span class="nm">'+esc(label||'À déterminer')+'</span>';
    var dis=!(m.a&&m.b);
    var stp=function(d,l){return '<button type="button" class="stp" '+(dis?'disabled ':'')+'data-step="'+esc(m.id)+'" data-side="'+key+'" data-d="'+d+'" aria-label="'+(d>0?'Un jeu de plus':'Un jeu de moins')+'">'+l+'</button>'};
    return '<div class="mt'+(win?' win':'')+(id?'':' ph')+(pop?' pop':'')+'"'+(ref?' data-ref="'+esc(ref)+'"':'')+'>'+nm+stp(-1,'−')+'<input class="sc'+(m.tie?' err':'')+'" inputmode="numeric" maxlength="2" '+(dis?'disabled ':'')+
      'data-sc="'+esc(m.id)+'" data-side="'+key+'" data-fk="sc-'+esc(m.id)+key+'" aria-label="Jeux '+esc(id?pairLabel(id):label||'')+'" value="'+esc(sc==null?'':sc)+'">'+stp(1,'+')+'</div>';
  }
  var done=!!m.res,live=!done&&!!S.starts[m.id];
  var stc=done?'done':live?'live':'todo';
  return '<div class="match '+stc+'"><div class="mh"><label><input type="checkbox" data-start="'+esc(m.id)+'" data-fk="st-'+esc(m.id)+'" '+(S.starts[m.id]?'checked ':'')+(m.a&&m.b?'':'disabled ')+'aria-label="Match commencé"><span>'+esc(short?m.title.replace(/^Poule \d+ · /,''):m.title)+'</span></label><span class="mhr">'+terSelect(m.id)+'<span class="stl">'+(done?'✓ Terminé':live?'● En cours':'À venir')+'</span>'+(S.starts[m.id]?statusBits(m):(short?'':'<span>'+esc(m.time)+'</span>'))+'</span></div>'+
    side(m.a,m.la,m.ra,'a',m.ia)+side(m.b,m.lb,m.rb,'b',m.ib)+'</div>';
}

/* pseudo et identifiant d'appareil : mémorisés dans le navigateur (localStorage) ET dans un cookie d'un an partagé entre tournois-badpad.fr et www.tournois-badpad.fr */
function ckGet(k){try{var m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?decodeURIComponent(m[1]):''}catch(e){return ''}}
function ckSet(k,v){try{var dom=/(^|\.)tournois-badpad\.fr$/i.test(location.hostname)?'; domain=.tournois-badpad.fr':'';document.cookie=k+'='+encodeURIComponent(v)+'; max-age=31536000; path=/; SameSite=Lax'+dom+(location.protocol==='https:'?'; Secure':'')}catch(e){}}

/* ---------- import ---------- */
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}
function fmtPhone(v){var s=String(v==null?'':v).replace(/[^\d+]/g,'');
  if(/^\d{9}$/.test(s)) return '0'+s; if(/^33\d{9}$/.test(s)) return '+'+s; return s}
function cell(v){
  if(v instanceof Date) return new Date(v.getTime()+12*3600e3).toISOString().slice(0,10);
  if(v==null) return ''; return String(v).trim();
}
function fmtBirth(v){var t=cell(v),m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t);return m?m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2):t}
function parseWide(aoa,hi){
  var H=aoa[hi].map(norm),c={};
  function find(re){for(var j=0;j<H.length;j++)if(re.test(H[j]))return j;return -1}
  [1,2].forEach(function(n){c[n]={nom:find(new RegExp('^nom joueur '+n+'$')),prenom:find(new RegExp('^prenom joueur '+n+'$')),naissance:find(new RegExp('naissance joueur '+n+'$')),
    licence:find(new RegExp('^licence joueur '+n+'$')),club:find(new RegExp('^club joueur '+n+'$')),classement:find(new RegExp('^classement joueur '+n+'$')),
    email:find(new RegExp('^(mail|courriel|email) joueur '+n+'$')),tel:find(new RegExp('^(telephone|portable|tel) joueur '+n+'$'))}});
  var pos=find(/^position/);
  function pl(r,m){return {nom:cell(r[m.nom]),prenom:cell(r[m.prenom]),naissance:m.naissance<0?'':fmtBirth(r[m.naissance]),licence:String(cell(m.licence<0?'':r[m.licence])).replace(/\.0$/,''),
    club:m.club<0?'':cell(r[m.club]),classement:String(cell(m.classement<0?'':r[m.classement])).replace(/\.0$/,''),email:m.email<0?'':cell(r[m.email]),tel:m.tel<0?'':fmtPhone(r[m.tel])}}
  var rows=aoa.slice(hi+1).filter(function(r){return cell(r[c[1].nom])||cell(r[c[2].nom])});
  if(pos>=0)rows.sort(function(a,b){return (+a[pos]||0)-(+b[pos]||0)});
  var pairs=rows.map(function(r){var p=blankPair();p.a=pl(r,c[1]);p.b=pl(r,c[2]);return p});
  return {pairs:pairs,odd:false,players:pairs.length*2};
}
function parseRows(aoa){
  for(var w=0;w<Math.min(aoa.length,10);w++){if(aoa[w].some(function(x){return norm(x)==='nom joueur 1'}))return parseWide(aoa,w)}
  var hi=-1;
  for(var i=0;i<Math.min(aoa.length,10);i++){if(aoa[i].some(function(c){return norm(c)==='nom'})){hi=i;break}}
  var col={nom:1,prenom:2,naissance:3,licence:4,club:5,classement:6,email:7,tel:8};
  if(hi>=0){
    col={};
    aoa[hi].forEach(function(h,j){var n=norm(h);
      if(n==='nom')col.nom=j;else if(n==='prenom')col.prenom=j;else if(n==='naissance'||n==='date de naissance')col.naissance=j;
      else if(n==='licence')col.licence=j;else if(n==='club')col.club=j;else if(n==='classement')col.classement=j;
      else if(/courriel|email|mail/.test(n))col.email=j;else if(/portable|tel|mobile/.test(n))col.tel=j});
  }
  var players=[];
  aoa.slice(hi+1).forEach(function(r){
    var nom=cell(r[col.nom]); if(!nom) return;
    players.push({nom:nom,prenom:cell(r[col.prenom]),naissance:cell(r[col.naissance]),licence:String(cell(r[col.licence])).replace(/\.0$/,''),
      club:cell(r[col.club]),classement:String(cell(r[col.classement])).replace(/\.0$/,''),email:cell(r[col.email]),tel:fmtPhone(r[col.tel])});
  });
  var pairs=[];
  for(var k=0;k+1<players.length;k+=2){var p=blankPair();p.a=players[k];p.b=players[k+1];pairs.push(p)}
  return {pairs:pairs,odd:players.length%2===1,players:players.length};
}
function applyImport(res){
  if(!res.pairs.length){importMsg='Aucune paire trouvée. Vérifie la ligne d\'en-tête (Nom, Prénom…).';return}
  S.pairs=res.pairs;S.groups=null;S.demo=false;S.meta.teams=res.pairs.length;
  importMsg=res.pairs.length+' paires importées'+(res.odd?' (un joueur en trop ignoré)':'')+'.';
}
function splitText(t){
  return t.split(/\r?\n/).filter(function(l){return l.trim()}).map(function(l){return l.indexOf('\t')>=0?l.split('\t'):(l.indexOf(';')>=0?l.split(';'):l.split(','))});
}

    drawTimer=setTimeout(function(){
      stopTick();
      o.innerHTML='<div class="dc1">'+esc(id?pairLabel(id):R.slotLabel(r))+'</div><div class="dc2">'+esc(R.slotLabel(r).replace(/ \(prov\.\)/,''))+'</div>';
      o.className='lock';
      drawTimer=setTimeout(function(){
        var t=document.querySelector('.mt[data-ref="'+r+'"]');
        if(t){var tr=t.getBoundingClientRect(),ease='cubic-bezier(.65,0,.25,1)',du=(1.1*spd)+'s';
          o.style.transition='left '+du+' '+ease+', top '+du+' '+ease+', transform '+du+' '+ease+', opacity '+du+' ease';
          o.style.left=(tr.left+tr.width/2)+'px';o.style.top=(tr.top+tr.height/2)+'px';
          o.style.transform='translate(-50%,-50%) scale(.28)';o.style.opacity='.35'}
        drawTimer=setTimeout(function(){
          if(!drawAnim)return;
          o.style.transition='opacity .25s';o.style.opacity='0';
          drawAnim.shown[r]=1;drawAnim.last=r;drawAnim.n++;render();
          drawTimer=setTimeout(step,500);
        },1150*spd);
      },1700*spd);
    },(first?3400:2000*spd)+600);
  }
  drawTimer=setTimeout(step,300);
}
var pDrag=null;
function clearPOver(){[].forEach.call(document.querySelectorAll('tr.ovt,tr.ovb,tr.dragging'),function(r){r.classList.remove('ovt','ovb','dragging')})}
document.addEventListener('dragstart',function(e){
  var h=e.target.closest&&e.target.closest('[data-pdrag]');if(!h)return;
  pDrag=+h.dataset.pdrag;var tr=h.closest('tr');
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','p'+pDrag);e.dataTransfer.setDragImage(tr,20,10)}catch(x){}
  setTimeout(function(){[].forEach.call(document.querySelectorAll('tr[data-prow="'+pDrag+'"]'),function(r){r.classList.add('dragging')})},0);
});
document.addEventListener('dragover',function(e){
  if(pDrag==null)return;var tr=e.target.closest&&e.target.closest('tr[data-prow]');if(!tr)return;
  e.preventDefault();
  [].forEach.call(document.querySelectorAll('tr.ovt,tr.ovb'),function(x){x.classList.remove('ovt','ovb')});
  tr.classList.add(tr.dataset.pj==='0'?'ovt':'ovb');
});
document.addEventListener('drop',function(e){
  if(pDrag==null)return;var tr=e.target.closest&&e.target.closest('tr[data-prow]');
  if(!tr){pDrag=null;clearPOver();return}
  e.preventDefault();var ti=+tr.dataset.prow,at=tr.dataset.pj==='0'?ti:ti+1,from=pDrag;pDrag=null;clearPOver();
  if(at===from||at===from+1)return;
  movePair(from,at);change();
});
document.addEventListener('dragend',function(){pDrag=null;clearPOver()});
var dragId=null;
function clearOver(){[].forEach.call(document.querySelectorAll('tr.ovt,tr.ovb,tr.dragging'),function(r){r.classList.remove('ovt','ovb','dragging')})}
document.addEventListener('dragstart',function(e){
  var h=e.target.closest&&e.target.closest('[data-drag]');if(!h)return;
  dragId=h.dataset.drag;var tr=h.closest('tr');
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.setDragImage(tr,20,10)}catch(x){}
  setTimeout(function(){tr.classList.add('dragging')},0);
});
document.addEventListener('dragover',function(e){
  if(!dragId)return;var tr=e.target.closest&&e.target.closest('tr[data-oid]');if(!tr)return;
  e.preventDefault();var r=tr.getBoundingClientRect(),top=e.clientY<r.top+r.height/2;
  [].forEach.call(document.querySelectorAll('tr.ovt,tr.ovb'),function(x){x.classList.remove('ovt','ovb')});
  tr.classList.add(top?'ovt':'ovb');
});
document.addEventListener('drop',function(e){
  if(!dragId)return;var tr=e.target.closest&&e.target.closest('tr[data-oid]');if(!tr){dragId=null;clearOver();return}
  e.preventDefault();var tid=tr.dataset.oid,r=tr.getBoundingClientRect(),top=e.clientY<r.top+r.height/2;
  var id=dragId;dragId=null;clearOver();if(tid===id)return;
  var o=R.order.filter(function(x){return x!==id}),ti=o.indexOf(tid);
  o.splice(top?ti:ti+1,0,id);S.order=o;change();
});
document.addEventListener('dragend',function(){dragId=null;clearOver()});
document.addEventListener('input',function(e){
  if(role!=='edit')return;
  var t=e.target;
  if(!t.dataset||!t.dataset.sc)return;
  t.value=t.value.replace(/\D/g,'').slice(0,2);
  if(t.value.length<1)return;
  if(t.dataset.side==='a'){var nx=document.querySelector('[data-sc="'+t.dataset.sc+'"][data-side="b"]');if(nx&&!nx.disabled){nx.focus();nx.select()}}
  else t.blur();
});
document.addEventListener('change',function(e){
  if(role!=='edit')return;
  var t=e.target;
  if(t.id==='impfile'&&t.files[0]){
    var f=t.files[0], rd=new FileReader();
    if(/\.csv$/i.test(f.name)){rd.onload=function(){applyImport(parseRows(splitText(String(rd.result))));change()};rd.readAsText(f)}
    else{
      if(!window.XLSX){importMsg='La bibliothèque Excel n\'a pas pu se charger : colle le contenu à la place.';change();return}
      rd.onload=function(){try{
        var wb=XLSX.read(rd.result,{type:'array',cellDates:true});
        var nm=wb.SheetNames.filter(function(n){return /inscr/i.test(n)})[0]||wb.SheetNames[0];
        var aoa=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:''});
        applyImport(parseRows(aoa));
      }catch(err){importMsg='Fichier illisible.'}change()};
      rd.readAsArrayBuffer(f);
    }
    return;
  }
  if(t.id==='loadjson'&&t.files[0]){
    var r2=new FileReader();r2.onload=function(){try{var o=JSON.parse(r2.result);if(o&&o.pairs&&o.meta){S=o;fixState();tab='accueil';change()}else setStatus('Ce fichier n\'est pas une sauvegarde valide.')}catch(err){setStatus('Sauvegarde illisible.')}};
    r2.readAsText(t.files[0]);return;
  }
  if(t.dataset.ct){
    var sc=t.closest('td,div.row'),hs=sc.querySelector('[data-part=h]'),ms=sc.querySelector('[data-part=m]'),val=hs.value?hs.value+':'+ms.value:'';
    if(t.dataset.ct==='glob'){S.meta.convG=val;S.meta.convPair={}}
    else{S.meta.convPair=S.meta.convPair||{};if(val)S.meta.convPair[t.dataset.ctid]=val;else delete S.meta.convPair[t.dataset.ctid]}
    change();return}
  if(t.dataset.meta){
    var k=t.dataset.meta,v=t.value;
    /* date en cours de frappe (année 0002, 0020, 0202…) : on attend une année complète avant de recalculer */
    if(k==='date'&&v&&!/^20\d\d-\d\d-\d\d$/.test(v))return;
    /* pas de re-rendu pendant la saisie (il ramenait le curseur sur le mois à chaque chiffre) : on enregistre et on met juste le titre à jour */
    if(k==='date'){S.meta.date=v;save();var tt2=document.getElementById('ttl');if(tt2)tt2.textContent=tName();return}
    if(['dur','courts','pause','teams','poules','seeds','qualified','seedRound'].indexOf(k)>=0){v=toInt(v,0)}
    S.meta[k]=v;
    if(k==='fmtCode'){if(FORMATS[v])S.meta.format=FORMATS[v]}
    if(k==='format'&&FORMATS[S.meta.fmtCode]&&v!==FORMATS[S.meta.fmtCode])S.meta.fmtCode='custom';
    if(k==='teams')adjustTeams(v);
    if(k==='poules'||k==='drawMode'||k==='qualified'||k==='seedMode'||k==='seeds')S.groups=null;
    change();return}
  if(t.dataset.custompts){
    if(t.checked){var n=Math.max(R.N,16),arr=[];for(var i=1;i<=n;i++)arr.push(pointsFor(i));S.customPoints=arr}else S.customPoints=null;
    change();return}
  if(t.dataset.cp!=null){S.customPoints[+t.dataset.cp]=num(t.value);change();return}
  if(t.dataset.pi!=null&&t.dataset.f){var p=S.pairs[+t.dataset.pi]; p[t.dataset.pp][t.dataset.f]=t.value.trim();S.demo=false;if(t.dataset.f==='classement'&&num(p.a.classement)&&num(p.b.classement))sortByWeight();change();return}
  if(t.dataset.sc){setScore(t.dataset.sc,t.dataset.side,t.value.replace(/\D/g,'').slice(0,2));change();return}
  if(t.dataset.start){var k2=t.dataset.start;
    if(t.checked){S.starts[k2]=Date.now();delete S.ends[k2]}else{delete S.starts[k2];delete S.ends[k2]}
    change();return}
  if(t.dataset.startt){var k3=t.dataset.startt,mm=/^(\d{1,2})\s*[h:]\s*(\d{0,2})$/i.exec(t.value.trim());
    if(mm){var d=new Date();d.setHours(+mm[1],+(mm[2]||0),0,0);S.starts[k3]=d.getTime()}else if(!t.value.trim()){delete S.starts[k3];delete S.ends[k3]}
    change();return}
  if(t.dataset.ter){if(t.value)S.terrains[t.dataset.ter]=t.value;else delete S.terrains[t.dataset.ter];change();return}
  if(t.dataset.time){var k4=t.dataset.time;if(t.value.trim())S.times[k4]=t.value.trim();else delete S.times[k4];change();return}
});

document.addEventListener('change',function(e){var t=e.target;if(role!=='edit')return;
  if(t&&t.id==='homeimport'&&t.files[0]){var r3=new FileReader();r3.onload=function(){try{var o=JSON.parse(r3.result);if(o&&o.pairs&&o.meta){var id=addT(o);openT(id)}else setStatus('Ce fichier n\'est pas une sauvegarde valide.')}catch(err){setStatus('Sauvegarde illisible.')}};r3.readAsText(t.files[0]);t.value=''}
});
load(); render(); startSync();
setInterval(function(){document.querySelectorAll('[data-dur]').forEach(function(e){e.textContent=durText(e.getAttribute('data-dur'))})},15000);
})();
